<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ReplyGraph Demo</title>
<meta name="description" content="ReplyGraph reads your iMessages locally, shows which conversations are waiting on you, and drafts a reply in your voice. It never sends." />
<meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script>
  // Set the theme before first paint so there is no flash.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('rg-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style id="rg-styles">
/* RG-STYLES-START: generated from frontend/src/styles.css by demo/sync-styles.mjs. Do not edit here. */
/* ============================================================
   ReplyGraph design system
   Shared by the React app (frontend/) and the static demo.
   Edit this file, then run `node demo/sync-styles.mjs` to push
   the same rules into demo/index.html.
   ============================================================ */

/* ---------- Tokens ---------- */
:root {
  /* Surfaces climb: page < card < raised */
  --bg: #fafafb;
  --bg-tint: #f2f2f6;
  --card: #ffffff;
  --raised: #ffffff;
  --panel: #f4f4f7;

  /* Ink descends */
  --ink: #14141b;
  --ink-2: #33333f;
  --muted: #656572;
  --faint: #9a9aa8;

  --line: #ebebf0;
  --line-2: #dedee6;

  /* Accent: a deep signal blue, with a cyan partner used only in the
     mark and the pulse graph. Everything else stays neutral. */
  --pop: #0f62d6;
  --pop-2: #12a5c4;
  --pop-ink: #0a4aa6;
  --pop-soft: #e7f0fd;
  --pop-ring: rgba(15, 98, 214, 0.26);

  --good: #0f9a6a;
  --good-soft: #e8f8f1;
  --good-line: #c7ecdc;
  --warn: #b8601c;
  --warn-soft: #fdf3ea;
  --warn-line: #f2ddc8;
  --danger: #b3352f;

  --shadow-sm: 0 1px 2px rgba(18, 18, 32, 0.04), 0 1px 3px rgba(18, 18, 32, 0.05);
  --shadow-md: 0 2px 6px rgba(18, 18, 32, 0.05), 0 8px 24px rgba(18, 18, 32, 0.07);
  --shadow-lg: 0 8px 20px rgba(18, 18, 32, 0.09), 0 28px 60px rgba(18, 18, 32, 0.14);

  --r: 14px;
  --r-sm: 10px;
  --r-xs: 7px;

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.4, 0.5, 1);

  --sidebar-w: 244px;
  color-scheme: light;
}

:root[data-theme='dark'] {
  --bg: #0a0c11;
  --bg-tint: #0f1116;
  --card: #12141a;
  --raised: #191c24;
  --panel: #1b1e27;

  --ink: #eef1f5;
  --ink-2: #ccd2dc;
  --muted: #8f97a5;
  --faint: #67707f;

  --line: #222732;
  --line-2: #2d323f;

  --pop: #6ba6ff;
  --pop-2: #4fd1e0;
  --pop-ink: #9cc5ff;
  --pop-soft: #0e1d33;
  --pop-ring: rgba(107, 166, 255, 0.32);

  --good: #34d399;
  --good-soft: #10281f;
  --good-line: #1d4438;
  --warn: #e5a35c;
  --warn-soft: #2a1d10;
  --warn-line: #4a341c;
  --danger: #f08a80;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.45), 0 12px 32px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.5), 0 32px 70px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'cv05' 1, 'cv08' 1, 'ss03' 1;
}

::selection { background: var(--pop); color: #fff; }

:focus-visible {
  outline: 2px solid var(--pop);
  outline-offset: 2px;
  border-radius: 4px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }

/* Inline icons default to the text size they sit next to. */
.ic { width: 16px; height: 16px; flex-shrink: 0; }

/* ---------- Shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }

.side {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-tint);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 14px 16px;
}

.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 22px; }
.brand .mark {
  width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(150deg, var(--pop) 0%, var(--pop-2) 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px var(--pop-ring);
}
.brand .mark span { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.brand h1 { font-size: 14.5px; font-weight: 600; letter-spacing: -0.015em; }
.brand h1 b { font-weight: 800; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 8px 10px; font-size: 13px; font-weight: 500;
  color: var(--muted); text-align: left; border-radius: var(--r-sm);
  transition: color 0.14s var(--ease), background 0.14s var(--ease);
  position: relative;
}
.nav button .ic { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.6; }
.nav button .count {
  margin-left: auto; font-family: var(--mono); font-size: 11px;
  color: var(--faint); font-variant-numeric: tabular-nums;
}
.nav button:hover { color: var(--ink); background: var(--panel); }
.nav button.active { color: var(--ink); background: var(--card); box-shadow: var(--shadow-sm); font-weight: 600; }
.nav button.active .ic { opacity: 1; color: var(--pop); }
.nav button.active .count { color: var(--pop); }
.nav button.active::before {
  content: ''; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--pop);
}

.side-foot { margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.trust {
  display: flex; align-items: flex-start; gap: 9px; padding: 11px 12px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--card);
}
.trust .ring {
  width: 7px; height: 7px; border-radius: 50%; background: var(--good);
  box-shadow: 0 0 0 3px var(--good-soft); margin-top: 5px; flex-shrink: 0;
}
.trust .ring.off { background: var(--faint); box-shadow: 0 0 0 3px var(--panel); }
.trust b { display: block; font-size: 12px; font-weight: 600; letter-spacing: -0.01em; }
.trust p { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

.status { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.status .ring { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }

.sync {
  width: 100%; padding: 10px; background: var(--ink); color: var(--bg);
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.005em;
  border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.14s var(--spring), opacity 0.14s var(--ease);
}
.sync:hover { transform: translateY(-1px); }
.sync:active { transform: translateY(0) scale(0.99); }
.sync:disabled { opacity: 0.6; cursor: default; transform: none; }
.sync .spin { width: 13px; height: 13px; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Main + topbar ---------- */
.main { flex: 1; overflow-y: auto; position: relative; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px 0 26px; height: 52px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted);
  position: sticky; top: 0; z-index: 30;
}
.topbar .note { display: flex; align-items: center; gap: 9px; min-width: 0; }
.topbar .note span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .spacer { margin-left: auto; }
.topbar-tools { display: flex; align-items: center; gap: 8px; }

.demo-pill {
  font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  color: var(--pop); background: var(--pop-soft); padding: 4px 8px; border-radius: 6px;
  flex-shrink: 0;
}

.iconbtn {
  width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
  transition: background 0.14s var(--ease), color 0.14s var(--ease), border-color 0.14s var(--ease);
}
.iconbtn:hover { background: var(--panel); color: var(--ink); border-color: var(--line-2); }
.iconbtn .ic { width: 16px; height: 16px; }

.kbd-open {
  display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px 0 11px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--card);
  color: var(--faint); font-size: 12.5px;
  transition: border-color 0.14s var(--ease), color 0.14s var(--ease);
}
.kbd-open:hover { border-color: var(--faint); color: var(--muted); }
.kbd-open .ic { width: 14px; height: 14px; }
kbd {
  font-family: var(--mono); font-size: 10.5px; line-height: 1; padding: 4px 5px;
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px;
  background: var(--panel); color: var(--muted);
}

/* ---------- Page furniture ---------- */
.wrap { max-width: 1180px; padding: 34px 34px 72px; }
.view { animation: viewIn 0.34s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.head { margin-bottom: 26px; max-width: 720px; }
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--pop); margin-bottom: 10px;
}
.head h2 {
  font-family: var(--display); font-size: 34px; font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.1;
  font-variation-settings: 'wght' 600, 'SOFT' 0, 'WONK' 0, 'opsz' 40;
}
.head p { color: var(--muted); margin-top: 9px; font-size: 13.5px; line-height: 1.55; }

.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sm { font-size: 12px; }
.xs { font-size: 11.5px; }
.row { display: flex; }
.between { justify-content: space-between; align-items: flex-start; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

hr { border: none; border-top: 1px solid var(--line); margin: 26px 0; }
.rule-strong { border-top: 1px solid var(--line-2); }

.sec-title {
  font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 13px;
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); }

/* ---------- Dashboard ---------- */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; margin-bottom: 16px; }
.tile {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-sm); padding: 16px 17px 15px; text-align: left; width: 100%;
  transition: box-shadow 0.2s var(--ease), transform 0.2s var(--spring), border-color 0.2s var(--ease);
}
.tile:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--line-2); }
.tile .k {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; color: var(--muted);
  display: flex; align-items: center; gap: 7px;
}
.tile .k .ic { width: 14px; height: 14px; opacity: 0.55; }
.tile .n {
  font-family: var(--mono); font-size: 36px; font-weight: 600; letter-spacing: -0.045em;
  margin-top: 12px; line-height: 1; font-variant-numeric: tabular-nums;
}
.tile .n.pop { color: var(--pop); }
.tile .cap { font-size: 11.5px; color: var(--faint); margin-top: 7px; }

.dash-cols { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }

.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.panel + .panel { margin-top: 16px; }
.panel-h {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 17px; border-bottom: 1px solid var(--line);
}
.panel-h h3 { font-size: 13px; font-weight: 650; letter-spacing: -0.005em; }
.panel-h .more {
  font-size: 12px; color: var(--pop); cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.panel-h .more .ic { width: 13px; height: 13px; }
.panel-h .more:hover { text-decoration: underline; }

.lrow {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  padding: 13px 17px; border-bottom: 1px solid var(--line); cursor: pointer;
  transition: background 0.14s var(--ease);
}
.lrow:last-child { border-bottom: none; }
.lrow:hover { background: var(--bg-tint); }
.lrow .av {
  width: 32px; height: 32px; border-radius: 10px; background: var(--panel);
  border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 700; color: var(--ink-2); flex-shrink: 0; letter-spacing: -0.01em;
}
.lrow .lr-body { flex: 1; min-width: 0; }
.lrow .lr-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lrow .lr-name { font-weight: 650; font-size: 13px; }
.lrow .lr-when { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.lrow .lr-prev { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .lr-meta { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.empty-row { padding: 22px 18px; color: var(--faint); font-size: 12.5px; }

/* ---------- Tags ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.01em; padding: 3px 8px; border-radius: 6px;
  border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; background: var(--card);
}
.tag.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag.pop { background: var(--pop-soft); color: var(--pop-ink); border-color: transparent; }
.tag.flag { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.tag.good { background: var(--good-soft); color: var(--good); border-color: var(--good-line); }
.tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ---------- Pulse graph (signature) ----------
   Their messages tick above the line, yours below.
   The unanswered stretch at the end glows. */
.pulse { display: block; width: 100%; overflow: visible; }
.pulse .axis { stroke: var(--line-2); stroke-width: 1; }
.pulse .tick-them { stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; }
.pulse .tick-me { stroke: var(--faint); stroke-width: 2; stroke-linecap: round; }
.pulse .gap { stroke: var(--pop); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 2 4; opacity: 0.85; }
.pulse .gap-glow { fill: url(#pulseFade); }
.pulse .now { fill: var(--pop); }
.pulse .now-halo { fill: var(--pop); opacity: 0.16; animation: halo 2.4s var(--ease) infinite; transform-origin: center; }
@keyframes halo { 0%, 100% { opacity: 0.1; r: 5; } 50% { opacity: 0.22; r: 8; } }
.pulse-legend {
  display: flex; gap: 14px; font-family: var(--mono); font-size: 10px;
  color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 6px;
}
.pulse-legend span { display: inline-flex; align-items: center; gap: 5px; }
.pulse-legend i { width: 8px; height: 2px; border-radius: 2px; background: currentColor; display: inline-block; }
.pulse-mini { width: 100%; height: 22px; margin-top: 9px; opacity: 0.9; }

/* ---------- Inbox ---------- */
.inbox { display: grid; grid-template-columns: 348px 1fr; height: 100vh; }
.threads { border-right: 1px solid var(--line); overflow-y: auto; background: var(--bg-tint); }
.threads-head {
  padding: 18px 18px 14px; position: sticky; top: 0; z-index: 2;
  background: color-mix(in srgb, var(--bg-tint) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.threads-head h3 { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variation-settings: 'wght' 600, 'SOFT' 0, 'WONK' 0, 'opsz' 28; }

.search { position: relative; margin-top: 13px; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--faint); pointer-events: none; }
.search input {
  width: 100%; padding: 9px 32px 9px 32px; border: 1px solid var(--line-2);
  border-radius: var(--r-sm); background: var(--card); font-size: 13px; outline: none;
  transition: border-color 0.14s var(--ease), box-shadow 0.14s var(--ease);
}
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--pop); box-shadow: 0 0 0 3px var(--pop-ring); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 6px; color: var(--faint); display: none; align-items: center; justify-content: center; }
.search.has-value .clear { display: flex; }
.search .clear:hover { background: var(--panel); color: var(--ink); }

.filters { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
.chip {
  font-size: 11.5px; font-weight: 600; padding: 5px 11px; border: 1px solid var(--line-2);
  background: var(--card); border-radius: 100px; color: var(--muted);
  transition: all 0.14s var(--ease); display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: var(--faint); color: var(--ink); }
.chip.on { border-color: var(--ink); color: var(--bg); background: var(--ink); }
.chip .n { font-family: var(--mono); font-size: 10.5px; opacity: 0.7; }

.thread {
  display: block; width: 100%; text-align: left;
  padding: 14px 18px; border-bottom: 1px solid var(--line); cursor: pointer;
  border-left: 2px solid transparent; transition: background 0.14s var(--ease);
}
.thread:hover { background: var(--panel); }
.thread.active { border-left-color: var(--pop); background: var(--card); }
.thread .t-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.thread .name { font-weight: 650; font-size: 13.5px; letter-spacing: -0.01em; }
.thread .when { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.thread .prev { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread .t-meta { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
.thread mark { background: var(--pop-soft); color: var(--pop-ink); border-radius: 3px; padding: 0 1px; }

.threads-empty { padding: 40px 22px; text-align: center; color: var(--faint); font-size: 12.5px; }

.detail { overflow-y: auto; padding: 28px 34px 56px; }
.detail-inner { max-width: 720px; }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.d-head h2 { font-family: var(--display); font-size: 27px; font-weight: 600; letter-spacing: -0.02em; font-variation-settings: 'wght' 600, 'SOFT' 0, 'WONK' 0, 'opsz' 32; }
.d-pulse { margin: 20px 0 4px; padding: 15px 16px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.d-pulse .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.d-pulse .ph b { font-size: 12px; font-weight: 650; }
.d-pulse .ph span { font-family: var(--mono); font-size: 11px; color: var(--pop); }

.convo { display: flex; flex-direction: column; gap: 10px; margin: 22px 0; max-height: 320px; overflow-y: auto; padding-right: 8px; }
.msg { max-width: 78%; animation: msgIn 0.3s var(--ease) backwards; }
.msg.me { align-self: flex-end; }
.msg.them { align-self: flex-start; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bubble { padding: 10px 14px; font-size: 13.5px; line-height: 1.5; border-radius: 16px; }
.me .bubble { background: var(--ink); color: var(--bg); border-bottom-right-radius: 5px; }
.them .bubble { background: var(--panel); border: 1px solid var(--line-2); border-bottom-left-radius: 5px; }
.msg .time { font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-top: 4px; }
.me .time { text-align: right; }
.silence {
  align-self: center; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 9px;
  width: 100%; justify-content: center; margin: 2px 0;
}
.silence::before, .silence::after { content: ''; height: 1px; flex: 1; background: var(--line); max-width: 90px; }

/* ---------- Draft composer ---------- */
.composer { margin-top: 4px; }
.reason {
  font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap; line-height: 1.5;
}
.draft-card {
  background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: var(--shadow-sm); padding: 16px 16px 12px;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.draft-card:focus-within { border-color: var(--pop); box-shadow: 0 0 0 4px var(--pop-ring); }
.draft-card textarea {
  width: 100%; border: none; outline: none; resize: none; min-height: 84px;
  font-size: 15.5px; line-height: 1.6; color: var(--ink); background: none; letter-spacing: -0.005em;
}
.draft-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: 0.03em;
}
.draft-card.writing textarea { color: var(--ink-2); }
.caret { display: inline-block; width: 2px; height: 1em; background: var(--pop); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Tone dial */
.tone-dial { margin: 18px 0 4px; }
.tone-dial-label, .rw-label {
  font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 9px;
}
.rw-label { margin: 20px 0 9px; }
.tone-seg-group {
  display: inline-flex; border: 1px solid var(--line-2); border-radius: 100px;
  padding: 3px; background: var(--panel); gap: 2px; position: relative;
}
.tone-seg {
  font-size: 12px; font-weight: 600; padding: 7px 16px; color: var(--muted);
  border-radius: 100px; transition: color 0.16s var(--ease); position: relative; z-index: 1;
}
.tone-seg:hover { color: var(--ink); }
.tone-seg.on { color: var(--ink); }
.tone-thumb {
  position: absolute; top: 3px; bottom: 3px; border-radius: 100px; background: var(--card);
  box-shadow: var(--shadow-sm); transition: transform 0.32s var(--spring), width 0.32s var(--spring);
  z-index: 0; pointer-events: none; opacity: 0;
}
.tone-thumb.shown { opacity: 1; }
.tone-caption { font-size: 12px; color: var(--faint); margin-top: 10px; max-width: 480px; line-height: 1.5; }

.rewrites { display: flex; flex-wrap: wrap; gap: 6px; }
.rw {
  font-size: 12px; padding: 6px 12px; border: 1px solid var(--line-2); background: var(--card);
  border-radius: 100px; color: var(--muted); transition: all 0.14s var(--ease);
}
.rw:hover { border-color: var(--pop); color: var(--pop); background: var(--pop-soft); transform: translateY(-1px); }
.rw:active { transform: translateY(0); }
.rw.used { border-color: var(--pop); color: var(--pop); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.btn {
  font-size: 12.5px; font-weight: 600; padding: 10px 15px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--card); color: var(--ink);
  display: inline-flex; align-items: center; gap: 7px;
  transition: all 0.14s var(--ease);
}
.btn .ic { width: 14px; height: 14px; }
.btn:hover { background: var(--panel); border-color: var(--faint); }
.btn:active { transform: scale(0.985); }
.btn.primary { background: var(--pop); border-color: var(--pop); color: #fff; }
.btn.primary:hover { background: var(--pop-ink); border-color: var(--pop-ink); }
.btn.solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.solid:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--panel); color: var(--ink); }
.btn.done { background: var(--good-soft); border-color: var(--good-line); color: var(--good); }

.flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.notice {
  background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: var(--r-sm);
  padding: 12px 14px; font-size: 12.5px; color: var(--warn); margin-top: 14px; line-height: 1.55;
  display: flex; gap: 10px; align-items: flex-start;
}
.notice .ic { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
.notice b { color: var(--warn); font-weight: 700; }

/* ---------- Follow-ups ---------- */
.fu { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 17px; border-bottom: 1px solid var(--line); }
.fu:last-child { border-bottom: none; }
.fu.leaving { animation: fuOut 0.3s var(--ease) forwards; }
@keyframes fuOut { to { opacity: 0; transform: translateX(14px); } }
.fu .task { font-weight: 600; font-size: 13.5px; letter-spacing: -0.005em; }
.fu .fu-meta { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.dir {
  font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 3px 7px; border-radius: 5px;
  background: var(--panel); border: 1px solid var(--line-2); color: var(--ink-2);
}
.conf { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.due { font-family: var(--mono); font-size: 11px; color: var(--pop); }
.empty { color: var(--faint); padding: 56px 0; text-align: center; font-size: 13px; }
.empty b { display: block; color: var(--ink); font-size: 15px; font-weight: 650; margin-bottom: 6px; }

/* ---------- Analytics ---------- */
.acard { padding: 19px 20px; margin-bottom: 13px; }
.acard .a-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.a-name { font-size: 15px; font-weight: 700; letter-spacing: -0.015em; }
.a-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); }
.stat .k { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.stat .v { font-weight: 650; font-size: 14px; margin-top: 5px; letter-spacing: -0.01em; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 0 14px 12px 0; }
td { padding: 12px 14px 12px 0; border-top: 1px solid var(--line); }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.usebar { display: flex; height: 10px; border-radius: 100px; overflow: hidden; background: var(--panel); margin-bottom: 14px; }
.usebar span { display: block; height: 100%; transition: width 0.5s var(--ease); }
.uselegend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; font-size: 11.5px; color: var(--muted); }
.uselegend i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; margin-right: 6px; }

/* ---------- Settings ---------- */
.ssection { margin-bottom: 28px; }
.srow { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; border-bottom: 1px solid var(--line); gap: 24px; }
.srow:last-child { border-bottom: none; }
.srow .s-label { font-weight: 650; font-size: 13.5px; letter-spacing: -0.005em; }
.srow .s-desc { font-size: 12px; color: var(--muted); margin-top: 3px; max-width: 460px; line-height: 1.5; }
.sinput {
  border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 9px 12px;
  font-size: 13px; width: 280px; outline: none; background: var(--card);
  transition: border-color 0.14s var(--ease), box-shadow 0.14s var(--ease);
}
.sinput:focus { border-color: var(--pop); box-shadow: 0 0 0 3px var(--pop-ring); }

.tog {
  width: 44px; height: 26px; border: 1px solid var(--line-2); background: var(--panel);
  border-radius: 100px; position: relative; flex-shrink: 0;
  transition: background 0.22s var(--ease), border-color 0.22s var(--ease);
}
.tog::after {
  content: ''; position: absolute; width: 20px; height: 20px; background: #fff;
  box-shadow: var(--shadow-sm); border-radius: 50%; top: 2px; left: 2px;
  transition: transform 0.28s var(--spring);
}
.tog.on { background: var(--pop); border-color: var(--pop); }
.tog.on::after { transform: translateX(18px); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 200; align-items: flex-end; }
.toast {
  background: var(--raised); color: var(--ink); border: 1px solid var(--line-2);
  padding: 11px 15px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 550;
  box-shadow: var(--shadow-lg); animation: toastIn 0.28s var(--spring);
  display: flex; align-items: center; gap: 9px; max-width: 340px;
}
.toast .ic { width: 15px; height: 15px; color: var(--good); flex-shrink: 0; }
.toast.leaving { animation: toastOut 0.22s var(--ease) forwards; }
.toast-error { border-color: var(--warn-line); }
.toast-error .ic { color: var(--danger); }
@keyframes toastIn { from { transform: translateY(10px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(6px); opacity: 0; } }

/* ---------- Command palette ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 300; background: rgba(12, 12, 20, 0.4);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: flex-start; justify-content: center; padding: 12vh 20px 20px;
  animation: fade 0.16s var(--ease);
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.palette {
  width: 100%; max-width: 560px; background: var(--raised); border: 1px solid var(--line-2);
  border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden;
  animation: paletteIn 0.24s var(--spring);
}
@keyframes paletteIn { from { transform: translateY(-10px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.palette-in { display: flex; align-items: center; gap: 11px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
.palette-in .ic { width: 16px; height: 16px; color: var(--faint); flex-shrink: 0; }
.palette-in input { flex: 1; border: none; outline: none; background: none; font-size: 15px; letter-spacing: -0.01em; }
.palette-in input::placeholder { color: var(--faint); }
.palette-list { max-height: 340px; overflow-y: auto; padding: 6px; }
.palette-group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); padding: 10px 11px 6px; }
.pitem {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 9px 11px; border-radius: var(--r-sm); font-size: 13.5px; color: var(--ink-2);
}
.pitem .ic { width: 15px; height: 15px; opacity: 0.6; flex-shrink: 0; }
.pitem .hint { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.pitem.sel { background: var(--pop-soft); color: var(--pop-ink); }
.pitem.sel .ic { opacity: 1; color: var(--pop); }
.pitem.sel .hint { color: var(--pop); }
.palette-foot {
  display: flex; gap: 16px; padding: 10px 17px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--faint); background: var(--card);
}
.palette-foot span { display: inline-flex; align-items: center; gap: 6px; }
.palette-empty { padding: 30px; text-align: center; color: var(--faint); font-size: 13px; }

/* Shortcut sheet */
.sheet {
  width: 100%; max-width: 520px; background: var(--raised); border: 1px solid var(--line-2);
  border-radius: 16px; box-shadow: var(--shadow-lg); padding: 24px 26px 22px;
  animation: paletteIn 0.24s var(--spring);
}
.sheet h3 { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
.sheet p { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 26px; }
.keys div { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-2); padding: 5px 0; border-bottom: 1px solid var(--line); }

/* ---------- Skeletons ---------- */
.skel { background: linear-gradient(90deg, var(--panel) 25%, var(--line) 37%, var(--panel) 63%); background-size: 400% 100%; animation: shimmer 1.3s linear infinite; border-radius: 6px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.loading { color: var(--faint); padding: 44px; text-align: center; font-size: 13px; }

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; }

/* ---------- Mobile ---------- */
.mobile-nav { display: none; }
.mobile-back { display: none; }

@media (max-width: 860px) {
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .dash-cols { grid-template-columns: 1fr; }
  .inbox { grid-template-columns: 300px 1fr; }
}

@media (max-width: 760px) {
  .app { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
  .side { display: none; }
  .main { height: auto; min-height: 100vh; padding-bottom: 78px; }
  .topbar { padding: 0 14px; height: 48px; gap: 8px; }
  .topbar .note span.txt { display: none; }
  .kbd-open { display: none; }
  .wrap { max-width: 100%; padding: 22px 16px 40px; }
  .head { margin-bottom: 20px; }
  .head h2 { font-size: 27px; }
  .stat-row { gap: 10px; margin-bottom: 12px; }
  .tile { padding: 14px; }
  .tile .n { font-size: 29px; margin-top: 8px; }

  .inbox { grid-template-columns: 1fr; height: auto; }
  .threads { border-right: none; }
  .threads-head { position: sticky; }
  .detail { padding: 16px 16px 40px; }
  .inbox.show-list .detail { display: none; }
  .inbox.show-detail .threads { display: none; }
  .mobile-back { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 14px; padding: 7px 12px; }
  .convo { max-height: none; }
  .d-head { flex-wrap: wrap; gap: 10px; }
  .d-head h2 { font-size: 22px; }
  .actions .btn { flex: 1 1 calc(50% - 8px); justify-content: center; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .keys { grid-template-columns: 1fr; }
  .scrim { padding: 6vh 12px 12px; }
  .toasts { left: 14px; right: 14px; bottom: 84px; align-items: stretch; }
  .toast { max-width: none; }

  .mobile-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
    border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 2px; font-size: 10px; font-weight: 600; color: var(--faint);
    transition: color 0.14s var(--ease);
  }
  .mobile-nav button span { white-space: nowrap; }
  .mobile-nav button .ic { width: 20px; height: 20px; opacity: 0.6; transition: transform 0.24s var(--spring); }
  .mobile-nav button.active { color: var(--pop); }
  .mobile-nav button.active .ic { opacity: 1; transform: translateY(-1px) scale(1.08); }
}

@media (max-width: 400px) {
  .stat-row { gap: 8px; }
  .tile .n { font-size: 26px; }
  .mobile-nav button { font-size: 9.5px; }
}

/* ---------- Motion preference ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
/* RG-STYLES-END */

function dur(mins) {
  if (mins < 60) return Math.round(mins) + 'm';
  if (mins < 60 * 36) return Math.round(mins / 60) + 'h';
  return Math.round(mins / 1440) + 'd';
}

// Deterministic pseudo-random so the graphs look the same on every load.
function seeded(seed) {
  let s = seed * 9301 + 49297;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

// A fortnight of message timestamps behind each thread, used by the pulse graph.
// `lastReply` is how long ago you last sent anything: after that point every
// message in the thread is theirs, which is the gap the graph is drawing.
function history(seed, density, msgs, lastReply) {
  const rnd = seeded(seed);
  const pts = [];
  let mins = 20160; // 14 days
  while (mins > 0) {
    const burst = 1 + Math.floor(rnd() * 2);
    for (let i = 0; i < burst; i++) {
      const at = Math.max(0, mins - i * (20 + rnd() * 70));
      pts.push({ me: at > lastReply && rnd() > 0.45, mins: at });
    }
    mins -= (600 + rnd() * 1900) / density;
  }
  if (lastReply < 20160) pts.push({ me: true, mins: lastReply });
  msgs.forEach(m => pts.push({ me: m.me, mins: (NOW - m.at) / MIN }));
  return pts.filter(p => p.mins > 0 && p.mins <= 20160).sort((a, b) => b.mins - a.mins);
}

/* ============================================================
   The pulse graph, the signature element.
   Their messages tick above the line, yours below. The stretch
   of silence since the last message glows at the right edge.
   ============================================================ */
function pulse(points, opts) {
  const o = Object.assign({ w: 640, h: 56, mini: false, window: 20160 }, opts || {});
  const pad = 6, mid = o.h / 2, inner = o.w - pad * 2;
  const up = o.mini ? 7 : 15, down = o.mini ? 6 : 13;
  const x = mins => pad + (1 - Math.min(mins, o.window) / o.window) * inner;

  const visible = points.filter(p => p.mins <= o.window);
  const ticks = visible.map(p => {
    const px = x(p.mins).toFixed(1);
    return p.me
      ? `<line class="tick-me" x1="${px}" y1="${mid + 2}" x2="${px}" y2="${mid + down}"/>`
      : `<line class="tick-them" x1="${px}" y1="${mid - 2}" x2="${px}" y2="${mid - up}"/>`;
  }).join('');

  // The band runs from your last message to now: the stretch they have been
  // waiting through. With no reply inside the window, the whole strip is a gap.
  const mine = visible.filter(p => p.me).map(p => p.mins);
  const openSince = mine.length ? Math.min.apply(null, mine) : o.window;
  const gapStart = x(openSince), gapEnd = o.w - pad;
  const gapWide = gapEnd - gapStart > 8;
  const uid = 'pf' + Math.round(gapStart * 100) + '-' + o.h + '-' + (o.mini ? 'm' : 'f');

  const gap = gapWide ? `
    <rect class="gap-glow" x="${gapStart.toFixed(1)}" y="${mid - up}" width="${(gapEnd - gapStart).toFixed(1)}" height="${up + down}" fill="url(#${uid})"/>
    <line class="gap" x1="${gapStart.toFixed(1)}" y1="${mid}" x2="${(gapEnd - 3).toFixed(1)}" y2="${mid}"/>` : '';

  const now = `
    ${reduceMotion || o.mini ? '' : `<circle class="now-halo" cx="${gapEnd}" cy="${mid}" r="5"/>`}
    <circle class="now" cx="${gapEnd}" cy="${mid}" r="${o.mini ? 2 : 3}"/>`;

  return `<svg class="pulse${o.mini ? ' pulse-mini' : ''}" viewBox="0 0 ${o.w} ${o.h}" ${o.mini ? '' : 'style="height:auto"'} preserveAspectRatio="none" role="img" aria-label="Two weeks of this thread; ${dur(openSince)} since you last replied">
    <defs><linearGradient id="${uid}" x1="0" x2="1">
      <stop offset="0" stop-color="var(--pop)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--pop)" stop-opacity="0.16"/>
    </linearGradient></defs>
    <line class="axis" x1="${pad}" y1="${mid}" x2="${o.w - pad}" y2="${mid}"/>
    ${ticks}${gap}${now}
  </svg>`;
}

function countUp() {
  document.querySelectorAll('.tile .n[data-count]').forEach(el => {
    const target = +el.dataset.count;
    if (reduceMotion || target === 0) { el.textContent = target; return; }
    const t0 = performance.now(), ms = 520;
    let net = 0;
    const step = now => {
      const p = Math.min(1, (now - t0) / ms);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
      else clearTimeout(net);
    };
    requestAnimationFrame(step);
    net = setTimeout(() => { el.textContent = target; }, ms + 400);
  });
}

/* ============================================================

function filtered() {
  let list = THREADS;
  if (state.filter === 'needs') list = list.filter(t => t.needs);
  else if (state.filter === 'risk') list = list.filter(t => t.priority === 'risky_to_answer_fast' || t.risk.length);
  const q = state.query.trim().toLowerCase();
  if (q) list = list.filter(t => (t.name + ' ' + t.last).toLowerCase().includes(q));
  return list;
}

function highlight(text) {
  const q = state.query.trim();
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i === -1) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function viewInbox() {

function pick(id) {

}
function openThread(id) { state.tab = 'inbox'; state.thread = id; state.inboxPane = 'detail'; render(); }
function backToList() { state.inboxPane = 'list'; const el = $('#inbox'); if (el) { el.classList.remove('show-detail'); el.classList.add('show-list'); } }
function setFilter(f) { state.filter = f; refreshThreadList(); }
function onSearch(v) {
  state.query = v;
  refreshThreadList();
  const input = $('#search');
  if (input && input.value !== v) input.value = v;
}
function flip(k) { state.toggles[k] = !state.toggles[k]; render(); toast(`${k === 'local' ? 'Local-only mode' : 'LLM drafts'} ${state.toggles[k] ? 'on' : 'off'}`); }

function complete(key) {
  const el = document.getElementById('fu-' + key);
  const finish = () => { state.completed.add(key); render(); toast('Marked done'); };
  if (el && !reduceMotion) { el.classList.add('leaving'); setTimeout(finish, 260); } else finish();
}

function onDraftInput(id, value) {
  stopTyping();
  state.drafts[id] = value;
  const wc = $('#wordCount');
  if (wc) wc.textContent = wordsOf(value);
}
function onDraftKey(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); copyDraft(state.thread); }
}

/* Type the new draft in rather than swapping it, so it reads as composing.
   Driven by elapsed time, so a throttled or backgrounded tab still lands on
   the complete text instead of stopping partway. */
let typing = null;
function stopTyping() {
  if (!typing) return;
  cancelAnimationFrame(typing.raf);
  clearTimeout(typing.net);
  const card = $('#draftCard');
  if (card) card.classList.remove('writing');
  typing = null;
}
function setDraftText(id, text) {
  stopTyping();
  state.drafts[id] = text;
  const ta = $('#draft'), card = $('#draftCard'), wc = $('#wordCount');
  if (!ta) return;
  const settle = () => { ta.value = text; if (wc) wc.textContent = wordsOf(text); };
  if (reduceMotion) { settle(); return; }

  card.classList.add('writing');
  ta.value = '';
  const ms = Math.min(700, 180 + text.length * 4);
  const t0 = performance.now();
  typing = { raf: 0, net: 0 };
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    const i = Math.round(text.length * p);
    ta.value = text.slice(0, i);
    if (wc) wc.textContent = wordsOf(ta.value);
    if (p < 1) typing.raf = requestAnimationFrame(step);
    else { stopTyping(); settle(); }
  };
  typing.raf = requestAnimationFrame(step);
  // Background tabs suspend rAF. Land on the full text regardless.
  typing.net = setTimeout(() => { stopTyping(); settle(); }, ms + 400);
}

function rewrite(id, type) {
  let t = state.drafts[id];
  const words = t.split(/\s+/);
  if (type === 'shorter') t = words.slice(0, Math.max(4, Math.ceil(words.length / 2))).join(' ');
  else if (type === 'casual') t = t.toLowerCase().replace(/[.!]+$/, '') + ' :)';
  else if (type === 'professional') t = t.charAt(0).toUpperCase() + t.slice(1).replace(/\s*:\)$/, '').replace(/[!]+/, '');
  else if (type === 'less apologetic') t = t.replace(/\b(sorry|i apologize|my bad|my fault)[,]?\s*/gi, '').replace(/^./, c => c.toUpperCase());
  else if (type === 'calmer') t = t.replace(/\b(ridiculous|insane|unacceptable|crazy)\b/gi, 'frustrating');
  else if (type === 'say no politely') t = "Thanks for thinking of me, but I can't make this one work. I appreciate the ask.";
  else if (type === 'buy time') t = "Thanks for this. I need a little time to think it through, and I'll get back to you shortly.";
  else if (type === 'one clear question') t = t.replace(/[?.!]+$/, '') + '. What works best for you?';
  else if (type === 'nicer') t = t.replace(/^./, c => c.toUpperCase()) + ' 🙂';
  else if (type === 'more direct') t = t.replace(/^(hey|hi|so|well|um|i think|maybe)[, ]+/i, '').replace(/^./, c => c.toUpperCase());
  else if (type === 'less fake') t = t.replace(/!+/g, '').replace(/\bso (excited|happy|thrilled)\b/gi, 'glad');
  else if (type === 'more adult') t = t.replace(/\blol\b/gi, '').replace(/\bhaha\b/gi, '').trim().replace(/^./, c => c.toUpperCase());
  else if (type === 'less defensive') t = t.replace(/\b(i was just|i didn'?t mean|for the record|to be clear)\b[, ]*/gi, '').replace(/^./, c => c.toUpperCase());

  state.used[id].add(type);
  const btns = document.querySelectorAll('#rewrites .rw');
  btns.forEach(b => { if (b.textContent.trim() === type) b.classList.add('used'); });
  setDraftText(id, t.trim());
  toast('Rewritten: ' + type);
}

function setTone(id, tone) {
  if (!TONE_VARIANTS[id] || !TONE_VARIANTS[id][tone]) return;
  state.tone[id] = tone;
  document.querySelectorAll('#toneGroup .tone-seg').forEach(b => {
    const on = b.dataset.tone === tone;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  positionThumb();
  setDraftText(id, TONE_VARIANTS[id][tone]);
}

function toneKeyNav(e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault();
  const segs = Array.from(document.querySelectorAll('.tone-seg'));
  const i = segs.indexOf(document.activeElement);
  if (i === -1) return;
  let next = e.key === 'ArrowRight' ? i + 1 : i - 1;
  if (next < 0) next = segs.length - 1;
  if (next >= segs.length) next = 0;
  segs[next].focus();
}

function copyDraft(id) {
  const text = state.drafts[id];
  const done = () => toast('Copied. Paste it wherever you like. ReplyGraph never sends.');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done);
  else done();
}

function doSync() {
  if (state.syncing) return;
  state.syncing = true;
  const btn = $('#syncBtn');
  btn.disabled = true;
  btn.innerHTML = `${IC.refresh.replace('class="ic"', 'class="ic spin"')} Syncing…`;
  setTimeout(() => {
    state.syncing = false;
    btn.disabled = false;
    btn.textContent = 'Sync messages';
    toast('In the real app this reads chat.db on your Mac');
  }, reduceMotion ? 200 : 1100);
}

function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('rg-theme', next); } catch (e) {}
  if (state.tab !== 'inbox') renderChrome();
}

function toast(msg, type) {
  const c = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' toast-error' : '');
  el.innerHTML = (type === 'error' ? IC.alert : IC.check) + '<span>' + esc(msg) + '</span>';
  c.appendChild(el);
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 220); }, 2600);
}

/* ============================================================
   Command palette and shortcut sheet
   ============================================================ */
function paletteItems() {
  const items = [];
  TABS.forEach(([id, label]) => items.push({ group: 'Go to', icon: id, label, hint: 'G ' + label[0].toUpperCase(), run: () => go(id) }));
  THREADS.forEach(t => items.push({ group: 'Threads', icon: 'inbox', label: t.name, hint: t.needs ? 'needs reply' : 'caught up', run: () => openThread(t.id) }));
  items.push({ group: 'Actions', icon: 'copy', label: 'Copy the current draft', hint: 'C', run: () => copyDraft(state.thread) });
  items.push({ group: 'Actions', icon: 'refresh', label: 'Sync messages', hint: '', run: doSync });
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  items.push({ group: 'Actions', icon: dark ? 'sun' : 'moon', label: `Switch to ${dark ? 'light' : 'dark'} theme`, hint: 'T', run: toggleTheme });
  items.push({ group: 'Actions', icon: 'keyboard', label: 'Keyboard shortcuts', hint: '?', run: showKeys });
  return items;
}

function matchedItems() {
  const q = state.paletteQuery.trim().toLowerCase();
  const all = paletteItems();
  if (!q) return all;
  return all.filter(i => i.label.toLowerCase().includes(q) || i.group.toLowerCase().includes(q));
}

function openPalette() { state.overlay = 'palette'; state.paletteQuery = ''; state.paletteIndex = 0; renderOverlay(); }
function showKeys() { state.overlay = 'keys'; renderOverlay(); }
function closeOverlay() { state.overlay = null; renderOverlay(); }

function renderOverlay() {
  const host = $('#overlay');
  if (!state.overlay) { host.innerHTML = ''; return; }

  if (state.overlay === 'keys') {
    const keys = [
      ['⌘K', 'Command palette'], ['/', 'Search threads'],
      ['G then D I F A E S', 'Jump to a section'], ['J / K', 'Next / previous thread'],
      ['1 2 3', 'Casual / warm / professional'], ['C', 'Copy the draft'],
      ['T', 'Toggle theme'], ['Esc', 'Close'],
    ];
    host.innerHTML = `<div class="scrim" onclick="if(event.target===this)closeOverlay()">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
        <h3>Keyboard shortcuts</h3>
        <p>ReplyGraph is built to be driven from the keyboard.</p>
        <div class="keys">${keys.map(([k, d]) => `<div><span>${d}</span><kbd>${k}</kbd></div>`).join('')}</div>
        <div style="margin-top:20px;text-align:right"><button class="btn" onclick="closeOverlay()">Close</button></div>
      </div></div>`;
    return;
  }

  const items = matchedItems();
  if (state.paletteIndex >= items.length) state.paletteIndex = Math.max(0, items.length - 1);
  let lastGroup = null;
  const rows = items.map((it, i) => {
    const header = it.group !== lastGroup ? `<div class="palette-group">${it.group}</div>` : '';
    lastGroup = it.group;
    return header + `<button class="pitem ${i === state.paletteIndex ? 'sel' : ''}" data-i="${i}"
      onmousemove="setPaletteIndex(${i})" onclick="runPalette(${i})">
      ${IC[it.icon]}<span>${esc(it.label)}</span>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ''}</button>`;
  }).join('');

  host.innerHTML = `<div class="scrim" onclick="if(event.target===this)closeOverlay()">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-in">
        ${IC.search}
        <input id="paletteInput" placeholder="Jump to a section, a thread, or an action…" value="${esc(state.paletteQuery)}"
          oninput="onPaletteInput(this.value)" autocomplete="off" aria-label="Command palette" />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-list" id="paletteList">${rows || '<div class="palette-empty">Nothing matches that.</div>'}</div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>Esc</kbd> dismiss</span>
      </div>
    </div></div>`;
  const input = $('#paletteInput');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function onPaletteInput(v) { state.paletteQuery = v; state.paletteIndex = 0; renderOverlay(); }
function setPaletteIndex(i) {
  if (state.paletteIndex === i) return;
  state.paletteIndex = i;
  document.querySelectorAll('.pitem').forEach(el => el.classList.toggle('sel', +el.dataset.i === i));
}
function runPalette(i) {
  const items = matchedItems();
  const it = items[i];
  closeOverlay();
  if (it) it.run();
}

/* ============================================================
   Keyboard
   ============================================================ */
let gPending = false;
const G_MAP = { d: 'dashboard', i: 'inbox', f: 'followups', a: 'analytics', e: 'exports', s: 'settings' };

document.addEventListener('keydown', e => {
  const typingHere = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    state.overlay === 'palette' ? closeOverlay() : openPalette();
    return;
  }

  if (state.overlay === 'palette') {
    const items = matchedItems();
    if (e.key === 'ArrowDown') { e.preventDefault(); state.paletteIndex = (state.paletteIndex + 1) % Math.max(1, items.length); renderOverlay(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); state.paletteIndex = (state.paletteIndex - 1 + items.length) % Math.max(1, items.length); renderOverlay(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(state.paletteIndex); }
    else if (e.key === 'Escape') { e.preventDefault(); closeOverlay(); }
    return;
  }
  if (state.overlay === 'keys' && e.key === 'Escape') { closeOverlay(); return; }

  if (e.key === 'Escape') {
    if (typingHere) { document.activeElement.blur(); return; }
    if (state.tab === 'inbox' && state.inboxPane === 'detail') backToList();
    return;
  }
  if (typingHere || e.metaKey || e.ctrlKey || e.altKey) return;

  if (gPending) {
    gPending = false;
    const dest = G_MAP[e.key.toLowerCase()];
    if (dest) { e.preventDefault(); go(dest); }
    return;
  }

  switch (e.key.toLowerCase()) {
    case 'g': gPending = true; setTimeout(() => { gPending = false; }, 900); break;
    case '?': showKeys(); break;
    case 't': toggleTheme(); break;
    case 'c': if (state.tab === 'inbox') copyDraft(state.thread); break;
    case '/':
      e.preventDefault();
      if (state.tab !== 'inbox') go('inbox');
      setTimeout(() => { const s = $('#search'); if (s) s.focus(); }, 30);
      break;
    case 'j': case 'k': {
      if (state.tab !== 'inbox') break;
      e.preventDefault();
      const list = filtered();
      if (!list.length) break;
      const i = list.findIndex(t => t.id === state.thread);
      const next = e.key.toLowerCase() === 'j'
        ? list[Math.min(list.length - 1, i + 1)] || list[0]
        : list[Math.max(0, i - 1)] || list[0];
      pick(next.id);
      break;
    }
    case '1': case '2': case '3': {
      if (state.tab !== 'inbox') break;
      const tone = ['casual', 'warm', 'professional'][+e.key - 1];
      setTone(state.thread, tone);
      break;
    }
  }
});

window.addEventListener('resize', positionThumb);

/* ============================================================
   Boot
   ============================================================ */
// #tab=inbox&thread=1&tone=casual preselects a view for screenshots.
function applyHashParams() {
  if (!location.hash) return;
  const params = new URLSearchParams(location.hash.slice(1));
  const tab = params.get('tab');
  const threadId = parseInt(params.get('thread'), 10);
  const tone = params.get('tone');
  const theme = params.get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  if (tab) state.tab = tab;
  if (!isNaN(threadId) && THREADS.some(t => t.id === threadId)) {
    state.thread = threadId;
    state.inboxPane = 'detail';
    if (!tab) state.tab = 'inbox';
    if (tone && TONE_VARIANTS[threadId] && TONE_VARIANTS[threadId][tone]) {
      state.tone[threadId] = tone;
      state.drafts[threadId] = TONE_VARIANTS[threadId][tone];
    }
  }
}

Object.assign(window, {
  go, pick, openThread, backToList, setFilter, onSearch, flip, complete,
  rewrite, setTone, toneKeyNav, copyDraft, toast, toggleTheme,
  openPalette, closeOverlay, showKeys, onPaletteInput, setPaletteIndex, runPalette,
  onDraftInput, onDraftKey,
});

applyHashParams();
render();
$('#syncBtn').addEventListener('click', doSync);
</script>
</body>
